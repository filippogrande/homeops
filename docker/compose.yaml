services:
  homeops:
    image: filippogrande/homeops:latest
    container_name: homeops
    restart: unless-stopped
    ports:
      - "8090:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/applicazioni/yml/docker:/stacks
      - ../config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 30s
      timeout: 5s
      retries: 3
